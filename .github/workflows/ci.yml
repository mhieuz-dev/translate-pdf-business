name: Kiểm thử

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test lõi bản web
        run: node --test web-tests/web-backend.test.js

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cài thư viện (không cần pdf2zh-next vì test dùng cầu nối giả)
        run: pip install fastapi "uvicorn[standard]" python-multipart pymupdf pytest httpx
      - name: Test máy chủ dịch PDF
        working-directory: server
        run: pytest -q tests
