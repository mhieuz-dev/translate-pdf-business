name: Kiểm thử

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Thư viện hệ thống cho Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - name: Test Rust (lõi + app)
        run: cargo test --workspace
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test bản web
        run: node --test web-tests/web-backend.test.js
