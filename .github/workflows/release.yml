name: Phát hành

# Gắn tag dạng v0.1.0 rồi đẩy lên là GitHub tự build bản cài cho Windows, macOS, Linux
# và tạo trang Release. Miễn phí với repo công khai.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Thư viện hệ thống cho Tauri (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Thông Ngữ ${{ github.ref_name }}
          releaseBody: |
            Tải bản cài cho máy bạn ở mục Assets bên dưới.

            - **Windows**: `.msi` hoặc `-setup.exe`
            - **macOS**: `.dmg` (`aarch64` cho chip Apple M1 trở lên, `x64` cho máy Intel)
            - **Linux**: `.deb` (Ubuntu/Debian), `.rpm` (Fedora) hoặc `.AppImage`

            App chưa có chữ ký số nên Windows/macOS có thể cảnh báo khi mở lần đầu, xem hướng dẫn trong README.
            Không muốn cài? Dùng bản web: https://thong-ngu.vercel.app
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
